name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite compilar manualmente con el botón "Run workflow"

jobs:
  build:
    name: Build AutoClicker APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🛠️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔧 Grant execute permission for gradlew or generate wrapper
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            echo "Gradle wrapper no detectado, generando automáticamente..."
            gradle wrapper
            chmod +x gradlew
          fi

      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: 📦 Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
