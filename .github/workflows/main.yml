name: Compilar AutoClicker

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Configurar Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Dar permisos de ejecución a Gradle
      # Usamos el wrapper de Gradle directamente
      run: chmod +x gradlew || true

    - name: Compilar APK con Gradle
      # Si gradlew no existe, forzamos el uso de Gradle 8
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.4
        arguments: assembleDebug

    - name: Subir APK generado
      uses: actions/upload-artifact@v3
      with:
        name: AutoClicker-APK
        path: app/build/outputs/apk/debug/app-debug.apk
